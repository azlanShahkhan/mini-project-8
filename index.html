<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h2>Weather App</h2>
  <input type="text" id="city" placeholder="Enter city (e.g. Lahore)">
  <button onclick="getWeather()">Check Weather</button>

  <div class="result">
    <p id="temp"></p>
    <p id="desc"></p>
    <p id="wind"></p>
  </div>
</div>

<script src="./script.js"></script>

</body>
</html>
